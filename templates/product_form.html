{% extends "base.html" %}{% block title %}{{ title }} · StockWise{% endblock %}
{% block content %}
<section class="hero"><div><p class="eyebrow">PRODUCT CATALOGUE</p><h1>{{ title }}</h1><p>Fields marked with * are required.</p></div></section>
<section class="panel form-panel"><form method="post" class="form-grid">
<label>Product name *<input name="name" required value="{{ product.get('name','') }}"></label>
<label>Category<input name="category" value="{{ product.get('category','') }}"></label>
<label>Quantity *<input type="number" name="quantity" min="0" required value="{{ product.get('quantity',0) }}"></label>
<label>Minimum stock *<input type="number" name="min_stock" min="0" required value="{{ product.get('min_stock',5) }}"></label>
<label>Unit price (₹) *<input type="number" name="unit_price" min="0" step="0.01" required value="{{ product.get('unit_price',0) }}"></label>
<label>Supplier<input name="supplier" value="{{ product.get('supplier','') }}"></label>
<div class="form-actions"><button class="button">Save product</button><a class="button ghost" href="{{ url_for('products') }}">Cancel</a></div>
</form></section>
{% endblock %}
